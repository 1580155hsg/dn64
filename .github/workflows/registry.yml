name: DN64 Registry

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    name: registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # PRs always execute the BASE branch's trusted validator, never PR code.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test trusted tooling and current registry
        run: |
          python -m unittest discover -s tests -v
          python utils/registry.py check
      - name: Validate PR blobs and maintainer signatures
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags "https://github.com/$REPOSITORY.git" "refs/pull/$PR_NUMBER/head:refs/remotes/origin/submitted-pr"
          ACTUAL_HEAD=$(git rev-parse refs/remotes/origin/submitted-pr)
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          python utils/registry.py check-pr --base "$BASE_SHA" --head "$EXPECTED_HEAD"
